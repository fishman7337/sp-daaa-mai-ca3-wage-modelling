name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  python:
    name: Python tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip install -e .

      - name: Run regression script
        run: python scripts/run_analysis.py

      - name: Run pytest
        run: python -m pytest

  latex:
    name: Build report PDF
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Compile LaTeX report
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          working_directory: report
          args: -pdf -interaction=nonstopmode -halt-on-error -file-line-error

      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        with:
          name: ms0240-ca3-report
          path: report/main.pdf
