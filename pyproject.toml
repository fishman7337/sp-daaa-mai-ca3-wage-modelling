[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ms0240-wages-regression"
version = "0.1.0"
description = "Regression utilities for the MS0240 CA3 Wages 2021 June analysis."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Goh Kun Ming" }
]
dependencies = [
  "numpy>=1.26",
  "pandas>=2.0",
  "openpyxl>=3.1"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.12.10"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
extend-exclude = [".dist", "notebooks"]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["B", "D", "E", "F", "I", "SIM", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D"]

[tool.ruff.lint.pydocstyle]
convention = "google"
